<main class="exercise-detail">
  <a mat-button [routerLink]="returnUrl">
    <mat-icon>arrow_back</mat-icon>
    Volver
  </a>

  @if (isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  @if (feedback()) {
    <div class="feedback">{{ feedback() }}</div>
  }

  @if (exercise(); as item) {
    <mat-card>
      <app-exercise-media [exercise]="item" />
      <div class="content">
        <span>{{ item.muscleGroup }}</span>
        <h1>{{ item.name }}</h1>
        <p>{{ item.description }}</p>
        @if (item.musclesInvolved) {
          <small>{{ item.musclesInvolved }}</small>
        }
        <button class="anatomy-toggle" mat-stroked-button type="button" (click)="showAnatomy.update(value => !value)">
          <mat-icon>accessibility_new</mat-icon>
          {{ showAnatomy() ? 'Ocultar mapa muscular' : 'Ver mapa muscular' }}
        </button>
        @if (showAnatomy()) {
          <app-exercise-body-map
            [muscleGroup]="item.muscleGroup"
            [musclesInvolved]="item.musclesInvolved"
            [muscles]="item.muscles ?? []" />
        }
      </div>
    </mat-card>
  }
</main>
